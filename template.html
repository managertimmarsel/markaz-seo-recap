<style>
/* Layout: dashboard Markaz — sidebar navy tetap di kiri, area kerja abu terang dengan grid kartu platform; tiap aplikasi membuka laporan card SEO-nya. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --line:#e3e6ee; --fg:#1d2236; --muted:#6a7189;
  --side:#141b3c; --side-2:#232b52; --side-fg:#e7e9f3; --side-muted:#9aa1c2;
  --accent:#2f5bd3; --accent-soft:#e6ecfb; --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b86a00; --warn-soft:#fbf0dc; --bad:#c62f2f; --bad-soft:#fbe6e6;
  --t1:#e53935; --t2:#b5481b; --t3:#77761e;
  --shadow:0 1px 2px rgba(20,27,60,.06),0 4px 14px rgba(20,27,60,.06);
  --f-ui:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1324; --surface:#171c33; --surface-2:#1c2240; --line:#2a3155; --fg:#e8eaf4; --muted:#9aa1bf;
  --side:#0b0f22; --side-2:#1b2247; --accent:#7d9cf2; --accent-soft:#232d55; --ok:#5cc98a; --ok-soft:#163626; --warn:#e8a647; --warn-soft:#3a2c12; --bad:#f07a7a; --bad-soft:#3c1c1f;
  --t1:#e5484d; --t2:#c9612f; --t3:#9a9832; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1324; --surface:#171c33; --surface-2:#1c2240; --line:#2a3155; --fg:#e8eaf4; --muted:#9aa1bf;
  --side:#0b0f22; --side-2:#1b2247; --accent:#7d9cf2; --accent-soft:#232d55; --ok:#5cc98a; --ok-soft:#163626; --warn:#e8a647; --warn-soft:#3a2c12; --bad:#f07a7a; --bad-soft:#3c1c1f;
  --t1:#e5484d; --t2:#c9612f; --t3:#9a9832; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}

/* sidebar */
.side{position:fixed;top:0;bottom:0;left:0;width:290px;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;z-index:50;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);transition:transform .25s ease}
.side-head{display:flex;align-items:center;gap:12px;padding:20px 18px 18px}
.logo{width:40px;height:40px;flex:none}
.brandlogo{height:44px;width:auto;flex:none;display:block}
.brand{font-size:22px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand b{font-weight:800;color:#8fb0ff}
.hamb{margin-left:auto;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--side-fg)}
.hamb:hover{background:var(--side-2)}
.side-body{overflow-y:auto;padding:0 12px 24px;flex:1}
.plat-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--side-2);border:0;border-radius:6px;padding:14px 16px;font-weight:800;font-size:16px;cursor:pointer;color:var(--side-fg)}
.plat-menu{margin-top:6px;background:var(--side-2);border-radius:6px;padding:6px;display:grid;gap:2px}
.plat-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--side-fg);display:flex;align-items:center;gap:10px;font-size:14px}
.plat-menu button:hover{background:rgba(255,255,255,.07)}
.side-search{margin:16px 0 8px;position:relative}
.side-search input{width:100%;border:0;border-radius:999px;padding:11px 14px 11px 42px;background:#fff;color:#1d2236;font-size:15px}
.side-search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#2f5bd3}
.side-label{font-size:13px;font-weight:800;letter-spacing:1.2px;color:var(--side-fg);margin:22px 6px 8px;text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav a,.nav button.grp{display:flex;align-items:center;gap:14px;padding:11px 8px;border-radius:6px;text-decoration:none;color:var(--side-fg);font-size:16px;background:none;border:0;width:100%;cursor:pointer;text-align:left}
.nav a:hover,.nav button.grp:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--side-2);font-weight:700}
.nav svg{flex:none;color:var(--side-muted)}
.nav a.on svg{color:#8fb0ff}
.nav .chev{margin-left:auto;transition:transform .2s}
.nav button.grp[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sub{display:grid;gap:1px;padding:2px 0 6px 38px}
.sub a{font-size:14px;padding:7px 8px;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sub .cnt{margin-left:auto;font-size:12px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--side-muted)}

/* main */
.main{flex:1;min-width:0;margin-left:290px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1640px;margin:0 auto;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:14px;padding:18px 0 14px}
.top h1{font-size:26px;font-weight:700;margin:0;text-wrap:balance}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--accent);text-decoration:none;font-weight:700}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{background:none;border:0;padding:8px;border-radius:50%;cursor:pointer;color:var(--fg);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface)}
.avatar{width:44px;height:44px;border-radius:50%;background:#f3b5b5;display:grid;place-items:center;color:#d85b5b;flex:none}
.menu-btn{display:none}
.datechip{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}

/* controls */
.searchbox{position:relative;max-width:390px;flex:1 1 260px}
.searchbox input{width:100%;border:1px solid transparent;background:var(--surface);border-radius:999px;padding:12px 16px 12px 46px;box-shadow:var(--shadow);font-size:15px}
.searchbox input:focus{border-color:var(--accent);outline:none}
.searchbox svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:4px 0 22px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}

/* platform grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px}
.pcard{position:relative;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:var(--fg);min-height:265px;transition:transform .15s ease,box-shadow .15s ease;border:1px solid transparent}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,27,60,.14)}
.pcard.none{opacity:.82}

function chgRows(list){

    let note='';
    if(it.cat==='kosong_lama' && it.b_after && it.b_after!==it.label) note=`Nama 11 Nov: ${esc(it.b_after)}`;
    else if(it.cat==='hilang') note=`Status 11 Nov: ${esc(it.b_status)}`;
    else if(it.cat==='seo_update') note=`Data SEO 11 Nov: ${esc(it.b_after)}`;
    else if(it.b_status) note=`Status 11 Nov: ${esc(it.b_status)}`;
    if(it.count) note=`${it.count} course`;
    return `<tr><td><a href="#app-${it.app}" class="after" style="text-decoration:none">${esc(a?a.name:it.app)}</a></td>
      <td><span class="tab-pill">${esc(it.tab)}</span>${it.id&&it.id!=='*'?`<div class="count">#${esc(it.id)}</div>`:''}</td>
      <td>${appName}</td><td>${seo}</td>
      <td><span class="st ${C.c}">${esc(C.t)}</span></td><td class="count">${note}</td></tr>`;
  }).join('');
}

/* ---------- helpers ---------- */
const stripCount = s=>String(s||'').replace(/\s*\(\d+\)\s*$/,'').trim();
function lenTag(s,min,max){ const t=stripCount(s); if(!t) return ''; const n=[...t].length; const ok=n>=min&&n<=max; return `<span class="len ${ok?'ok':'warn'}" title="Batas ${min}–${max} karakter">${n} kar.</span>`; }
function stClass(s){ if(/dilewati/i.test(s)) return 'skip'; if(/gagal/i.test(s)) return 'bad'; if(/sudah sesuai|manual|revisi|mirror|latsol/i.test(s)) return 'info'; return 'ok'; }
function slug2(s){ return '/'+String(s).toLowerCase().replace(/sma\/k/g,'sma smk').replace(/\//g,' ').replace(/\([^)]*\)/g,' ').replace(/&/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s-]/g,' ').split(/[\s-]+/).filter(Boolean).join('-'); }
function slugify(s){
  const rom={'i':'1','ii':'2','iii':'3','iv':'4','v':'5'};
  return '/'+String(s).toLowerCase().replace(/\([^)]*\)/g,' ').replace(/&/g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9\s-]/g,' ').split(/[\s-]+/).filter(Boolean).filter(w=>w!=='dan'&&w!=='and').map(w=>rom[w]&&/^(i|ii|iii|iv|v)$/.test(w)?rom[w]:w).join('-');
}
function table(rows){
  if(!rows||!rows.length) return '';
  const [h,...b]=rows;
  return `<div class="tscroll"><table><thead><tr>${h.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function blocks(bs){
  let html='', list=[];
  const flush=()=>{ if(list.length){ html+=`<ul class="prose-list">${list.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`; list=[]; } };
  bs.forEach(b=>{
    if(b.p){ list.push(b.p); return; }
    flush();
    if(b.h) html+=`<h3>${esc(b.h)}</h3>`;
    else if(b.h3) html+=`<h4>${esc(b.h3)}</h4>`;
    else if(b.table) html+=table(b.table);
  });
  flush(); return html;
}
function copyText(btn,text){
  const done=()=>{const o=btn.textContent;btn.textContent='Tersalin';setTimeout(()=>btn.textContent=o,1200)};
  try{ navigator.clipboard.writeText(text).then(done,()=>selectFallback(btn)); }catch(e){ selectFallback(btn); }
}
function selectFallback(btn){ const el=btn.previousElementSibling; if(!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

   <p class="hint" style="margin-top:12px">Untuk semua aplikasi: jika URL yang sudah terindeks berubah, pasang redirect 301, lalu perbarui sitemap dan internal link.</p></div>`;
}

function vApp(a){
  if(!a){ location.hash='platform'; return; }
  if(!a.done){
    view.innerHTML = `<div class="panel"><div class="hero">${mono(a,true)}<div class="t"><h2>${esc(a.name)}</h2><div class="chips"><span class="chip">Tier ${a.tier}</span><span class="chip mono-t">?p=${esc(a.kode)}</span><span class="chip">${esc(a.fokus)}</span></div></div></div>
      <p style="margin-top:18px">Belum ada laporan before–after untuk ${esc(a.name)}. Gunakan rumus umum dan cek isian sebelum mulai mengisi Data SEO.</p>
      <div class="chips" style="margin-top:12px"><a class="chip" href="#rumus">Lihat rumus SEO</a><a class="chip" href="#cek">Cek isian</a></div></div>`;
    return;
  }
  const s=a.stats, tabs=[...new Set(a.rows.map(r=>r.tab))];
  const stK='tab:'+a.slug, sub=store.get(stK,'card');
  view.innerHTML = `<div class="panel"><div class="hero">${mono(a,true)}<div class="t"><h2>${esc(a.name)}</h2><div class="chips"><span class="chip">Tier ${a.tier}</span><span class="chip mono-t">?p=${esc(a.kode)}</span><span class="chip">${esc(s.tanggal)}</span><span class="chip">${esc(a.fokus)}</span><span class="chip mono-t">${esc(a.domain)}</span></div></div></div>
    <div class="stats"><div class="stat"><div class="k">Card aktif</div><div class="v">${s.aktif}</div></div><div class="stat"><div class="k">Dioptimasi</div><div class="v ok">${s.opt}</div></div><div class="stat"><div class="k">Dilewati</div><div class="v ${s.skip?'warn':''}">${s.skip}</div></div><div class="stat"><div class="k">Data SEO</div><div class="v" style="font-size:20px">${esc(s.verSeo)}</div></div><div class="stat"><div class="k">Mirror</div><div class="v" style="font-size:20px">${esc(s.verMirror)}</div></div></div>
    <div class="tabs" role="tablist">${[['card','Card SEO'],['chg','Perubahan 19 Nov ('+needOf(a.slug)+')'],['usulan','Rekap Nama 20/11 ('+propOf(a.slug).length+')'],['skill','Skill & Rumus'],['catatan','Ringkasan & Catatan']].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===sub}">${l}</button>`).join('')}</div>
    <div id="sub"></div></div>`;
  const drawSub=k=>{
    REDRAW=null; store.set(stK,k); view.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===k));
    const box=$('#sub');
    if(k==='skill'){ box.innerHTML=`<p class="lead">Rumus yang dipakai saat mengoptimasi ${esc(a.name)}.</p>${table([['Unsur','Rumus','Contoh'],...a.rumus])}`; return; }
    if(k==='catatan'){ box.innerHTML=blocks(a.blocks); return; }
    if(k==='usulan'){ box.innerHTML=rumusBox(a.slug)+'<div id="rkb"></div>'; rekapList($('#rkb'),a.slug); return; }
    REDRAW=null;
    if(k==='chg'){
      const items=(CHG[a.slug]?.items||[]).slice().sort((x,y)=>CAT_ORDER.indexOf(x.cat)-CAT_ORDER.indexOf(y.cat)); const o=chgOf(a.slug);
      box.innerHTML = items.length ? `<p class="lead">Data dibaca ulang dari Markaz pada 19 Nov 2026: ${CHG[a.slug].aktif} card aktif. ${needOf(a.slug)} card perlu tindakan.</p>
        <div class="chips" style="margin-bottom:14px">${CAT_ORDER.filter(k=>o[k]).map(k=>`<span class="st ${CAT[k].c}">${esc(CAT[k].t)}: ${o[k]}</span>`).join('')}</div>${chgTable('at')}`
        : `<div class="empty">Tidak ada perubahan dibanding laporan 11 Nov.</div>`;
      if(items.length) $('#at').innerHTML=chgRows(items.map(i=>({...i,app:a.slug})));
      return;
    }
    const statuses=[...new Set(a.rows.map(r=>r.status))];
    box.innerHTML=`<div class="bar"><div class="searchbox">${ICON_SEARCH}<input id="cq" type="search" placeholder="Cari nama, slug, atau keyword..." aria-label="Cari card"></div>
      <div class="seg" role="group" aria-label="Saring tab">${['Semua',...tabs].map((t,i)=>`<button data-tab="${t}" aria-pressed="${i===0}">${t}</button>`).join('')}</div>
      ${statuses.length>1?`<select class="sel" id="cs" aria-label="Saring status"><option value="">Semua status</option>${statuses.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:''}
      <span class="count" id="cc"></span></div>
      <div class="tscroll"><table><thead><tr><th>Tab</th><th>Nama before → after</th><th>URL Slug</th><th>Keyword</th><th>Status</th></tr></thead><tbody id="ct"></tbody></table></div>
      <p class="hint" style="margin-top:10px">Klik baris untuk melihat Meta Title, Meta Description, dan Deskripsi beserta jumlah karakternya.</p>`;
    let curTab='Semua';
    const draw=()=>{
      const q=$('#cq').value.trim().toLowerCase(), st=$('#cs')?$('#cs').value:'';
      const list=a.rows.filter(r=>(curTab==='Semua'||r.tab===curTab)&&(!st||r.status===st)&&(!q||[r.before,r.after,r.slug,r.kw,r.id,r.item].join(' ').toLowerCase().includes(q)));
      $('#cc').textContent=`${list.length} dari ${a.rows.length} card`;
      $('#ct').innerHTML = list.map((r,i)=>{
        const same = r.before===r.after;
        return `<tr class="rowx" tabindex="0" aria-expanded="false" data-i="${a.rows.indexOf(r)}"><td><span class="tab-pill">${esc(r.tab)}</span>${r.id?`<div class="count">#${esc(r.id)}</div>`:''}</td>
          <td>${same?'':`<div class="before">${esc(r.before)}</div>`}<div class="after">${esc(r.after)}</div></td>
          <td>${r.slug?`<span class="slug">${esc(r.slug)}</span>`:'<span class="count">–</span>'}</td>
          <td>${r.kw?`<span class="kw">${esc(r.kw)}</span>`:'<span class="count">–</span>'}</td>
          <td><span class="st ${stClass(r.status)}">${esc(r.status)}</span></td></tr>`;
      }).join('') || `<tr><td colspan="5"><div class="empty">Tidak ada card yang cocok dengan filter.</div></td></tr>`;
    };
    $('#cq').addEventListener('input',draw); if($('#cs')) $('#cs').addEventListener('change',draw);
    box.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{curTab=b.dataset.tab; box.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw();}));
    const toggle=tr=>{
      const open=tr.getAttribute('aria-expanded')==='true';
      if(open){ tr.setAttribute('aria-expanded','false'); tr.nextElementSibling?.classList.contains('detail')&&tr.nextElementSibling.remove(); return; }
      const r=a.rows[+tr.dataset.i]; const course=r.tab==='Course';
      const tMin=course?45:60, tMax=course?60:70;
      const d=document.createElement('tr'); d.className='detail';
      d.innerHTML=`<td colspan="5"><div class="dgrid">
        ${r.item?`<div class="l">Item</div><div>${esc(r.item)}</div>`:''}
        <div class="l">Meta Title</div><div>${r.mt?esc(stripCount(r.mt))+lenTag(r.mt,tMin,tMax):'<span class="count">–</span>'}</div>
        <div class="l">Meta Description</div><div>${r.md?esc(stripCount(r.md))+lenTag(r.md,130,150):'<span class="count">–</span>'}</div>
        <div class="l">Deskripsi</div><div>${r.desc?esc(r.desc):'<span class="count">–</span>'}</div>
        ${r.slug?`<div class="l">URL Slug</div><div><span class="slug">${esc(r.slug)}</span><button class="copy">Salin</button></div>`:''}
        ${r.reason?`<div class="l">Alasan dilewati</div><div>${esc(r.reason)}</div>`:''}
      </div></td>`;
      tr.after(d); tr.setAttribute('aria-expanded','true');
      d.querySelector('.copy')?.addEventListener('click',e=>{e.stopPropagation(); copyText(e.currentTarget,r.slug);});
    };
    $('#ct').addEventListener('click',e=>{const tr=e.target.closest('tr.rowx'); if(tr) toggle(tr);});
    $('#ct').addEventListener('keydown',e=>{const tr=e.target.closest('tr.rowx'); if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); toggle(tr);}});
    draw();
  };
  view.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>drawSub(b.dataset.t)));
  drawSub(sub);
}

/* ---------- router ---------- */
const TITLES={platform:'Pilih Platform',perubahan:'Perubahan 19 Nov',meeting:'Catatan Meeting 20 Nov',rekap:'Rekap Nama 20/11/2026',rumus20:'Rumus Revisi 20/11/2026',usulan:'Rekap Nama 20/11/2026',ringkasan:'Ringkasan',rumus:'Rumus SEO',cek:'Cek Isian',kendala:'Kendala & Tindak Lanjut'};
function route(){
  let v=(location.hash||'#platform').slice(1); if(!TITLES[v]&&!v.startsWith('app-')) v='platform';
  setActive(v); REDRAW=null;
  if(v.startsWith('app-')){ const a=BY[v.slice(4)]; $('#title').textContent=a?a.name:'Pilih Platform'; $('#crumb').innerHTML=`<a href="#platform">Pilih Platform</a><span>/</span><span>Tier ${a?a.tier:''}</span>`; vApp(a); }
  else { $('#title').textContent=TITLES[v]; $('#crumb').innerHTML=v==='platform'?'<span>Markaz SEO</span>':'<a href="#platform">Pilih Platform</a>'; ({platform:vPlatform,perubahan:vPerubahan,meeting:vMeeting,rekap:vRekap,rumus20:vRumus20,usulan:vRekap,ringkasan:vRingkasan,rumus:vRumus,cek:vCek,kendala:vKendala})[v](); }
  document.body.classList.remove('nav-open');
  window.scrollTo(0,0);
}
buildSide();
$('#chgBadge').textContent=NEED_TOT; $('#propBadge').textContent=REVIEWABLE.length; initStore();
window.addEventListener('hashchange',route);
$('#openNav').addEventListener('click',()=>document.body.classList.add('nav-open'));
$('#hamb').addEventListener('click',()=>document.body.classList.remove('nav-open'));
$('#scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));
$('#themeBtn').addEventListener('click',()=>{
  const r=document.documentElement; const cur=r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark'; r.setAttribute('data-theme',next); store.set('theme',next);
});
const saved=store.get('theme',''); if(saved) document.documentElement.setAttribute('data-theme',saved);
route();
})();
</script>
